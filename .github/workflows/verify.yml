name: Verify a build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      triplet:
        type: string
        required: true
      profile:
        type: string
        required: true
      artifact:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  QT_VERSION: '6.10.3'
  TRIPLET: ${{ inputs.triplet }}
  CI_PROFILE: ${{ inputs.profile }}
  CI_PRESET: ${{ inputs.profile == 'gui' && 'release' || 'headless-release' }}
  PACKSTACKER_VERSION: ${{ inputs.version }}

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install build tools
        run: .github/scripts/setup-build-tools.ps1
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/setup-linux.sh "$CI_PROFILE"
      - name: Install Windows clang-tidy
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/setup-windows-llvm.ps1
      - name: Install Qt SDK or standalone MinGW
        if: inputs.profile == 'gui' || runner.os == 'Windows'
        run: .github/scripts/setup-sdk.ps1 -Profile $env:CI_PROFILE
      - name: Bootstrap vcpkg at the manifest baseline
        run: .github/scripts/setup-vcpkg.ps1
      - name: Cache vcpkg binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ inputs.triplet }}-qt-${{ env.QT_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/scripts/setup-*') }}
      - name: Configure
        run: .github/scripts/configure.ps1
      - name: C++ static analysis
        run: .github/scripts/lint-cxx.ps1
      - name: QML lint
        if: inputs.profile == 'gui'
        run: cmake --build "build/$env:CI_PRESET" --target packstacker_gui_qmllint --parallel 2
      - name: Build
        run: cmake --build --preset $env:CI_PRESET --parallel 2
      - name: Tests
        run: ctest --preset $env:CI_PRESET --no-tests=error
      - name: Install, package and smoke-test
        env:
          ARTIFACT_NAME: ${{ inputs.artifact }}
        run: .github/scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact }}
          path: ${{ env.PACKSTACKER_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
